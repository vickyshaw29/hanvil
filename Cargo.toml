[package]
name = "hanvil"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "A local Hedera network in one binary, with snapshot and revert"
repository = "https://github.com/vickyshaw29/hanvil"
readme = "README.md"
keywords = ["hedera", "hiero", "evm", "local-node", "devtools"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
alloy-consensus = { version = "2.4", features = ["k256", "serde"] }
alloy-eips = { version = "2.4", features = ["serde"] }
alloy-primitives = { version = "1", features = ["serde", "k256", "rlp", "std"] }
alloy-rlp = "0.3"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
ed25519-dalek = "3"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
parking_lot = "0.12"
prost = "0.14"
prost-types = "0.14"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = { version = "1.13", default-features = false, features = ["std", "unicode-perl", "unicode-case", "perf"] }
revm = { version = "43", features = ["std", "serde", "optional_balance_check", "optional_block_gas_limit", "optional_no_base_fee"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml_ng = "0.10"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "process", "io-util", "fs"] }
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
